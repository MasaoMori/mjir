---
layout: default
---
<article class="post h-entry" itemscope itemtype="http://schema.org/BlogPosting">
  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">{{ page.title | escape }}</h1>
    <p class="post-meta"><time class="dt-published" datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%Y年%m月%d日" }}</time>{% if page.categories.size > 0 %} ・ {{ page.categories | join: "、" }}{% endif %}</p>
  </header>
  <div class="post-content e-content" itemprop="articleBody">{% include content.html %}</div>
</article>
