<section id="sidebar" class="secondary clearfix" role="complementary">
  <aside class="widget widget_recent_entries clearfix">
    <h3 class="widgettitle"><span>最新の投稿</span></h3>
    <ul>
      {%- for p in site.posts limit: 10 -%}
      <li><a href="{{ p.url | relative_url }}">{{ p.title | escape }}</a> <span class="post-date">{{ p.date | date: "%Y-%m" }}</span></li>
      {%- endfor -%}
    </ul>
  </aside>
</section>
